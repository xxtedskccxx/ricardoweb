name: Database backup

# Daily encrypted pg_dump of the production Neon database, kept as a workflow
# artifact for 30 days. The repo is public, so the dump is always encrypted
# with BACKUP_PASSPHRASE before upload. Restore steps: docs/DEPLOYMENT.md.
on:
  schedule:
    - cron: "0 7 * * *" # 03:00 in Santo Domingo
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add DATABASE_URL and BACKUP_PASSPHRASE as repository secrets."
            exit 1
          fi

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Client major version must be >= the Neon server's (Postgres 18).
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > db.dump
          test -s db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output db.dump.gpg db.dump
          rm db.dump

      - uses: actions/upload-artifact@v4
        with:
          name: altamar-db-${{ github.run_id }}
          path: db.dump.gpg
          retention-days: 30
